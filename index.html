<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>규칙의 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kirang+Haerang&family=Orbit&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 입구 텍스트 → 작품(캔버스)과 조작판 → 해설 → 벽 → 출구 텍스트. 인터페이스 색은 참고 이미지의 아홉 색에서 가져왔다. 어두운 방 하나로 고정한다. */
:root {
  --bg: #151515;
  --raise: #1f201d;
  --line: #373932;
  --ink: #d8dfca;
  --muted: #a1a791;
  --sage: #c6ccb8;
  --amber: #f3ae42;
  --orange: #ed6a2f;
  --magenta: #de82f5;
  --lav: #dcc9f7;
  --blue: #324cff;
  --sky: #6bb0ec;
  --display: "Kirang Haerang", system-ui, sans-serif;
  --body: "Orbit", sans-serif;
  --mono: "Orbit", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.65;
  font-weight: 400;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.intro { .intro { display: flex; flex-direction: column; gap: 14px; max-width: calc(100% - 388px); } }
.kicker, .lab, .mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em; }
.kicker { color: var(--lav); text-transform: uppercase; }
h1 { font-family: var(--display); color: #de82f5; font-weight: 400; font-size: clamp(48px, 10vw, 112px); line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead { margin: 0; font-size: 17px; text-wrap: pretty; }
.lead span { color: var(--muted); }

.room { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.work { margin: 0; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stage { aspect-ratio: 4 / 3; max-width: 100%; background: #0a0a0a; border: 1px solid var(--line); overflow: hidden; touch-action: pan-y; }
.stage canvas { display: block; width: 100%; height: 100%; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: transparent; border: 1px solid var(--line); color: var(--ink);
  padding: 6px 12px; cursor: pointer; font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--orange); border-color: var(--orange); color: #151515; font-weight: 400; }
button.primary:hover { filter: brightness(1.08); }
button[aria-pressed="true"] { border-color: var(--ink); background: var(--raise); }
.caption { display: flex; flex-direction: column; gap: 4px; }
.caption .title { font-weight: 400; font-size: 17px; }
.caption .mono { color: var(--muted); overflow-wrap: anywhere; }

.panel { display: flex; flex-direction: column; min-width: 0; border-top: 1px solid var(--line); }
.group { display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.group h2 { margin: 0; font-family: var(--mono); font-weight: 400; font-size: 13px; letter-spacing: 0.04em; color: var(--sage); }
.group p { margin: 0; }
.row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.row output { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--sky); min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { padding: 7px 4px; }
select { background: var(--raise); border: 1px solid var(--line); padding: 6px 8px; min-width: 0; width: 100%; }
input[type="color"] { width: 40px; height: 32px; padding: 0; background: none; border: 1px solid var(--line); cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 34px; height: 34px; padding: 0; border-radius: 0; border: 1px solid var(--line); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.bgrow { display: flex; align-items: center; gap: 10px; }
.pals { display: flex; flex-wrap: wrap; gap: 8px; }
.pals button { padding: 0; width: 64px; height: 28px; border-radius: 0; }
.zones { display: flex; flex-direction: column; gap: 12px; }
.zone { display: grid; grid-template-columns: 22px minmax(0, 1fr) 40px; gap: 8px 10px; align-items: center; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.zone:last-child { border-bottom: 0; padding-bottom: 0; }
.zn { font-family: var(--mono); font-size: 13px; color: var(--amber); }
.zsub { grid-column: 2 / 4; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.zsub select:disabled { opacity: 0.4; }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.check input { accent-color: var(--sky); width: 16px; height: 16px; }
details summary { cursor: pointer; font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; color: var(--sage); }
details[open] summary { margin-bottom: 10px; }
textarea { width: 100%; min-height: 150px; resize: vertical; background: var(--raise); border: 1px solid var(--line); padding: 8px; font-family: var(--mono); font-size: 11px; line-height: 1.5; }
.recipe-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
.note { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.wall { display: flex; flex-direction: column; gap: 16px; }
.wall h2 { margin: 0; font-family: var(--body); font-weight: 400; font-size: 24px; }
.hung { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.empty .empty { margin: 0; color: var(--muted); max-width: calc(100% - 388px); }
.piece { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.piece img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; border: 1px solid var(--line); cursor: pointer; }
.piece .mono { color: var(--muted); overflow-wrap: anywhere; }
.piece .btns { display: flex; gap: 6px; }
.piece .btns button { padding: 3px 8px; font-size: 12px; }

.outro { max-width: calc(100% - 388px); color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; margin: 0; }

@media (max-width: 900px) {
  .room { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .room { grid-template-columns: minmax(0, 1fr); }
  .intro { max-width: none; }
  .empty, .outro { max-width: none; }
}
</style>

<div class="wrap">
  <header class="intro">
    <p class="kicker">온라인 전시 · 세상에 없는 전시</p>
    <h1>규칙의 방</h1>
    <p class="lead">이 방에는 걸려 있는 작품이 없습니다. 격자, 점, 빗금, 사각형, 곡선, 색이 놓여 있을 뿐입니다.<br><span>바탕부터 영역의 수까지 관람자가 고릅니다. 마음에 들면 벽에 겁니다.</span></p>
  </header>

  <main class="room">
    <figure class="work">
      <div class="stage" id="stage"><canvas id="cv" aria-label="관람자의 선택으로 움직이는 격자 그래픽"></canvas></div>
      <div class="tools">
        <button id="pause" type="button">정지</button>
        <button id="shuffle" type="button">무작위로 섞기</button>
        <button id="reseed" type="button">시드 다시 뽑기</button>
        <button id="hang" type="button" class="primary">벽에 걸기</button>
        <button id="png" type="button">PNG 저장</button>
        <button id="gif" type="button">GIF 저장</button>
        <span class="note" id="dlnote" role="status"></span>
      </div>
      <figcaption class="caption" id="caption"></figcaption>
    </figure>

    <aside class="panel" id="panel" aria-label="조작판"></aside>
  </main>

  <section class="wall" aria-labelledby="wall-h">
    <h2 id="wall-h">벽</h2>
    <p class="empty" id="empty">아직 걸린 작품이 없습니다. 위에서 규칙을 고르고 '벽에 걸기'를 누르면 이곳에 한 점씩 쌓입니다.</p>
    <div class="hung" id="hung"></div>
  </section>

  <p class="outro">벽에 건 작품은 이 페이지를 닫으면 사라집니다. 남기려면 조작판 아래의 레시피를 복사해 두세요.</p>
</div>

<script>

      if (tick) await tick(f + 1, frames.length);
    }
    parts.push(new Uint8Array([0x3B]));
    return new Blob(parts, { type: 'image/gif' });
  }

  $('#png').addEventListener('click', function () {
    if (busy) return;
    var keep = ptr; ptr = null; draw(); ptr = keep; dirty = true;
    cv.toBlob(function (b) {
      if (!b) { say('이미지를 만들지 못했습니다'); return; }
      expN++; saveFile('rule-room-' + expN + '.png', b);
    }, 'image/png');
  });
  $('#gif').addEventListener('click', async function () {
    if (busy) return;
    busy = true; var btn = this; btn.disabled = true;
    var keepT = t, keepPtr = ptr; ptr = null;
    try {
      var gw = 400, gh = 300, fps = 12, n = 36, dt = 1 / fps;
      var oc = document.createElement('canvas'); oc.width = gw; oc.height = gh;
      var octx = oc.getContext('2d', { willReadFrequently: true }), frames = [];
      for (var f = 0; f < n; f++) {
        draw(); octx.drawImage(cv, 0, 0, gw, gh); frames.push(octx.getImageData(0, 0, gw, gh).data);
        t += dt * S.speed;
        if (S.field === 'life') { lifeAcc += dt * S.speed; if (lifeAcc > 0.35) { lifeAcc = 0; stepLife(); } }
        say('GIF 만드는 중 ' + Math.round((f + 1) / n * 40) + '%');
        await wait();
      }
      var blob = await encodeGif(frames, gw, gh, fps, async function (i, total) {
        say('GIF 만드는 중 ' + (40 + Math.round(i / total * 60)) + '%'); await wait();
      });
      expN++; say('');
      await saveFile('rule-room-' + expN + '.gif', blob);
    } catch (err) { say('GIF를 만들지 못했습니다'); }
    t = keepT; ptr = keepPtr; dirty = true; busy = false; btn.disabled = false;
  });

  buildZoneRows();
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);
  else window.addEventListener('resize', layout);
  if (paused) $('#pause').textContent = '재생';
  layout(); syncUI(); renderWall();
  requestAnimationFrame(frame);
})();
</script>
